<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Base redondeada estilo GNOME App -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad)" stroke="#334155" stroke-width="2" />

  <!-- Vinilo / Disco sutil de fondo -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="64" cy="64" r="32" fill="none" stroke="#475569" stroke-width="1" opacity="0.4" />

  <!-- Ondas / Frecuencia Hi-Res -->
  <path d="M 32 64 Q 40 40 48 64 T 64 64 T 80 64 T 96 64" fill="none" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round" />

  <!-- Triángulo Play central -->
  <polygon points="58,52 76,64 58,76" fill="url(#accent-grad)" />

  <!-- Badge Hi-Res Audio dorado -->
  <g transform="translate(68, 78)">
    <rect x="0" y="0" width="46" height="20" rx="5" fill="url(#gold-grad)" />
    <text x="23" y="14" fill="#000000" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1">HI-RES</text>
  </g>
</svg>
