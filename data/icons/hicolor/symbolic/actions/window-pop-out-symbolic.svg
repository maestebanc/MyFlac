<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Ventana grande (fondo, esquina superior-izquierda) -->
  <rect x="1" y="2" width="9" height="7" rx="1.2"
        fill="none" stroke="currentColor" stroke-width="1.25" opacity="0.5"/>
  <!-- Ventana pequeña flotante (delante, esquina inferior-derecha) -->
  <rect x="7" y="8" width="7.5" height="5.5" rx="1.2"
        fill="currentColor" opacity="0.15"/>
  <rect x="7" y="8" width="7.5" height="5.5" rx="1.2"
        fill="none" stroke="currentColor" stroke-width="1.25"/>
  <!-- Barra de título de la ventana pequeña -->
  <line x1="7" y1="10" x2="14.5" y2="10"
        stroke="currentColor" stroke-width="1.0" opacity="0.6"/>
</svg>
