[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myflac"
version = "0.2.0"
description = "Bit-perfect Hi-Res audio player for GNOME"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Miguel Angel Esteban" }]
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47",
    "Pillow>=10.0",
]

[project.scripts]
myflac = "myflac.app:main"

[tool.setuptools.packages.find]
include = ["myflac*"]

# Hojas de estilo, iconos y placeholder: sin esto, "pip install ." (Flatpak) no los instala
[tool.setuptools.package-data]
myflac = ["resources/*.png", "resources/*.svg", "resources/css/*.css", "resources/icons/**/*"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
