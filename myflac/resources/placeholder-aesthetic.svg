<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Dark glass gradient -->
    <radialGradient id="bgAura" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#2a221e" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1a181c" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#121114" stop-opacity="1.0"/>
    </radialGradient>

    <!-- Warm aesthetic ambient glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="47%" r="42%">
      <stop offset="0%" stop-color="#e89b6a" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#b8623b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#b8623b" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Washed / Aesthetic terracotta & amber gradient -->
    <linearGradient id="washedFlac" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#e5a173" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#b8623e" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Subtle vinyl / sound groove stroke -->
    <linearGradient id="subtleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5a173" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Rich dark background -->
  <rect width="512" height="512" rx="32" fill="url(#bgAura)"/>
  <!-- Ambient light -->
  <rect width="512" height="512" rx="32" fill="url(#ambientGlow)"/>

  <!-- Concentric audiophile sound rings (subtle, elegant, aesthetic) -->
  <circle cx="256" cy="248" r="190" fill="none" stroke="url(#subtleRing)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="256" cy="248" r="155" fill="none" stroke="url(#subtleRing)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.55"/>
  <circle cx="256" cy="248" r="122" fill="none" stroke="url(#subtleRing)" stroke-width="1.2" opacity="0.35"/>

  <!-- Centered MyFlac Play emblem in washed / aesthetic tone -->
  <g transform="translate(110, 102) scale(2.35)">
    <!-- Play shape silhouette with soft rounded corners -->
    <path
      fill="url(#washedFlac)"
      d="M 26 18 C 17 13 12 17 12 28 L 12 100 C 12 111 17 115 26 110 L 108 69 C 117 64 117 56 108 51 Z"
    />

    <!-- Beamed music notes in soft cream / frosted white -->
    <g fill="#fcfaf7" fill-opacity="0.93">
      <ellipse cx="40" cy="84" rx="11" ry="9.5" transform="rotate(-14 40 84)"/>
      <ellipse cx="67" cy="74" rx="11" ry="9.5" transform="rotate(-14 67 74)"/>
      <rect x="47" y="41" width="8" height="43" rx="4"/>
      <rect x="74" y="31" width="8" height="43" rx="4"/>
      <polygon points="47,40 82,28 82,39 47,51"/>
    </g>
  </g>

  <!-- Minimalist aesthetic soundline at bottom -->
  <g opacity="0.45" transform="translate(256, 420)">
    <circle cx="-40" cy="0" r="2" fill="#e5a173"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#e5a173" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="40" cy="0" r="2" fill="#e5a173"/>
  </g>
</svg>
