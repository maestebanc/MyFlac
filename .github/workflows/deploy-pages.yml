name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["master"]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  # Cada versión publicada trae un repositorio Flatpak nuevo que hay que desplegar
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Repositorio Flatpak firmado (…/MyFlac/repo) adjunto a la última release. No se guarda en
      # git para no llenar el historial de binarios en cada versión.
      - name: Add Flatpak repository from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p web/repo
          gh release download --repo "${{ github.repository }}" --pattern myflac-flatpak-repo.tar.gz --output "$RUNNER_TEMP/repo.tar.gz"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" -C web/repo
          test -f web/repo/summary.idx.sig

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
