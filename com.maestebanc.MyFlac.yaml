app-id: com.maestebanc.MyFlac
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: myflac

finish-args:
  # Interfaz gráfica Wayland y X11
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Salida de audio mediante PipeWire / PulseAudio
  - --socket=pulseaudio
  # Modo exclusivo bit-perfect: acceso directo a /dev/snd (ALSA hw) y reserva de la tarjeta
  # frente a PipeWire mediante org.freedesktop.ReserveDevice1 (own incluye talk)
  - --device=all
  - --own-name=org.freedesktop.ReserveDevice1.*
  # Icono en la barra superior (StatusNotifierItem, extensión AppIndicator de GNOME)
  - --talk-name=org.kde.StatusNotifierWatcher
  # Conexión de red para letras online (LRCLIB) y fotos de artista (Deezer / Wikipedia)
  - --share=network
  # Acceso de lectura a la carpeta de música y directorio de usuario
  - --filesystem=xdg-music:ro
  - --filesystem=home:ro
  # Integración MPRIS2 con el shell de GNOME
  - --own-name=org.mpris.MediaPlayer2.myflac

modules:
  - name: python3-mutagen
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links=. --prefix=/app mutagen-1.48.1-py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/47/d8/a29e4e3991765e7ce4ed1f7e4074fe1ba9da03e0048639734de60f9cadb9/mutagen-1.48.1-py3-none-any.whl
        sha256: 4f077fe87d3fc7fba259aa63d8c026b18382ca6a42ef37c61e16f1b1b5b82fe7

  - name: python3-pillow
    buildsystem: simple
    # Wheel binario por arquitectura: flatpak-builder solo descarga el de la que se compila
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links=. --prefix=/app pillow==12.3.0
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/f7/62/de5bdd77d935331f4f802edc11e4d82950f642caad6cb2f949837b8560e2/pillow-12.3.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 0847a763afefb695bc912d7c131e7e0632d4edc1d8698f58ddabec8e46b8b6d3
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/1f/01/e18aff37cb0b4aac47ac90f016d347a49aca667ef97f190b06ac2aabc928/pillow-12.3.0-cp313-cp313-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: f7401aebd7f581d7f83a439d87d474999317ee099218e5ad25d125290990ba65

  - name: myflac
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 data/com.maestebanc.MyFlac.desktop /app/share/applications/com.maestebanc.MyFlac.desktop
      - install -Dm644 data/com.maestebanc.MyFlac.metainfo.xml /app/share/metainfo/com.maestebanc.MyFlac.metainfo.xml
      - for size in 16 22 24 32 48 64 128 256 512; do install -Dm644 data/icons/hicolor/${size}x${size}/apps/com.maestebanc.MyFlac.png /app/share/icons/hicolor/${size}x${size}/apps/com.maestebanc.MyFlac.png; done
      - install -Dm644 data/icons/hicolor/scalable/apps/com.maestebanc.MyFlac.svg /app/share/icons/hicolor/scalable/apps/com.maestebanc.MyFlac.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/com.maestebanc.MyFlac-symbolic.svg /app/share/icons/hicolor/symbolic/apps/com.maestebanc.MyFlac-symbolic.svg
      - install -Dm644 data/icons/hicolor/symbolic/actions/window-pop-out-symbolic.svg /app/share/icons/hicolor/symbolic/actions/window-pop-out-symbolic.svg
    sources:
      - type: dir
        path: .
